server.port=9090

# Camunda Admin User
camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin
camunda.bpm.admin-user.firstName=Admin

# Task Filter
camunda.bpm.filter.create=All Tasks

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:camunda;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# FTTH Backend URL
ftth.backend.base-url=http://localhost:8085

# EOC Delegate Configuration (placeholder values for local testing)
eoc.ftth.product-spec-id=TEST-PRODUCT-SPEC-001
eoc.ftth.service-spec-id=TEST-SERVICE-SPEC-001
eoc.ftth.catalog-id=TEST-CATALOG-001

# EOC Service Registry REST API
eoc.sr.base-url=http://localhost:8090/cwf/sr/v1
eoc.sr.username=upadmin
eoc.sr.password=upadmin
